[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kunal Paul", email = "kp2346578@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "faker>=40.54.0",
    "fastapi[standard]>=0.165.0",
    "google-genai>=3.6.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
]

[project.scripts]
ai-data-analyst-agent = "ai_data_analyst_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
